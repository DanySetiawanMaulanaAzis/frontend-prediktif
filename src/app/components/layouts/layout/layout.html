<div class="layout" [class.sidebar-collapsed]="isSidebarCollapsed()" [class.no-sidebar]="!isEngineer">
  <!-- Sidebar hanya ditampilkan jika user adalah Engineer -->
  @if (isEngineer) {
  <!-- Navbar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-text">PrediktIF</span>

      <!-- Tombol Toggle Minimize/Expand -->
      <button type="button" class="btn-toggle" (click)="toggleSidebar()">
        <span class="icon">{{ isSidebarCollapsed() ? '❯' : '❮' }}</span>
      </button>
    </div>

    <!-- Tag NAV untuk tautan navigasi utama -->
    <nav class="sidebar-nav">
      <a routerLink="/engineer" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a routerLink="/add-machine" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Mesin</span>
      </a>
    </nav>
  </aside>
  }

  <!-- Right Section -->
  <div class="main-layout">
    <header class="header">
      <!-- Sisi Kanan: Area Pengguna & Dropdown -->
      <div class="header-user">
        <button type="button" class="user-profile" (click)="toggleDropdown()">
          <!-- Avatar bulat otomatis mengambil huruf pertama nama user -->
          <div class="user-avatar">
            {{ user?.name ? user?.name?.substring(0, 1)?.toUpperCase() : 'U' }}
          </div>

          <!-- Informasi Akun -->
          <div class="user-info">
            <span class="username">{{ user?.name || 'Guest User' }}</span>
            <span class="role">{{ role || 'Member' }}</span>
          </div>

          <!-- Ikon Panah dengan Class Dinamis Angular -->
          <span class="arrow" [class.arrow-rotate]="showDropdown">▼</span>
        </button>

        <!-- Konten Menu Dropdown -->
        @if (showDropdown) {
        <div class="dropdown">
          <div class="dropdown-header">
            <p class="dropdown-user-name">{{ user?.name }}</p>
            <p class="dropdown-user-role">{{ role }}</p>
          </div>

          <button type="button" class="btn-logout" (click)="logout()">
            <!-- Ikon Logout Sederhana -->
            <svg class="logout-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </button>
        </div>
        }
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

    <footer class="footer">© 2026 PrediktIF</footer>
  </div>
</div>
